
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetterie - Festival Electro Vibes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Billetterie - Festival Electro Vibes</h1>

    <p>Réservez vos billets pour participer à notre festival !</p>

    <form>
        <label for="nom">Nom complet :</label>
        <input type="text" id="nom" name="nom" required>

        <br><br>

        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="type">Type de billet :</label>
        <select id="type" name="type">
            <option value="standard">Standard</option>
            <option value="vip">VIP</option>
        </select>

        <br><br>

        <label for="quantite">Nombre de billets :</label>
        <input type="number" id="quantite" name="quantite" min="1" required>

        <br><br>

        <button type="submit">Réserver</button>
    </form>

    <br>
    <a href="index.html">Retour à l'accueil</a>

</body>
</html>
